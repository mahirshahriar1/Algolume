name: Supabase keep-alive

# Free-tier Supabase pauses after a week idle; ping it every 6 hours and email
# the maintainer (via Web3Forms) if the database is unreachable.
on:
  schedule:
    - cron: "17 */6 * * *" # every 6h, off the top of the hour (GitHub cron is busy at :00)
  workflow_dispatch: {}

permissions:
  actions: write # lets the last step keep this scheduled workflow from being auto-disabled
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ping Supabase (alert on failure)
        run: node scripts/supabase-keepalive.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling via the API resets that clock without needing a commit.
      - name: Keep this workflow enabled
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
